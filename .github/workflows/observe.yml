name: 3. Observe

on:
    schedule:
        - cron: "20 3 * * *"
    workflow_dispatch:

concurrency:
    group: collect
    queue: max

permissions:
    contents: write

jobs:
    observe:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip

            - run: pip install -r requirements.txt

            - run: python -u -m sources.observe

            - name: Commit observations
              if: always()
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/observations
                  if git diff --staged --quiet; then
                      echo "Nothing to commit."
                      exit 0
                  fi
                  git commit -m "observations $(date -u +%Y-%m-%d)"
                  git pull --rebase
                  git push
