name: Train

on:
    schedule:
        - cron: "20 15 * * 1"
    workflow_dispatch:

concurrency:
    group: collect
    queue: max

permissions:
    contents: write

jobs:
    train:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip

            - run: pip install -r requirements.txt

            - run: python -u -m model.train

            - name: Commit model
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add models
                  if git diff --staged --quiet; then
                      echo "Nothing to commit."
                      exit 0
                  fi
                  git commit -m "model $(date -u +%Y-%m-%d)"
                  git pull --rebase
                  git push
