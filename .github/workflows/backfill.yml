name: Backfill

on:
    workflow_dispatch:

concurrency:
    group: collect
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    backfill:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
                  cache: pip

            - run: pip install -r requirements.txt

            - run: python backfill.py

            - name: Commit backfill
              if: always()
              run: |
